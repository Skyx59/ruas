# Derive the public scheme from the configured hostname, never from inbound headers.
map $host $ruas_forwarded_proto {
    default          $scheme;
    antislop.stei.fun https;
}

upstream ruas_core {
    zone ruas_core 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server core-service:8000 resolve;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 16k;
    absolute_redirect off;

    location /api/ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://ruas_core;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $ruas_forwarded_proto;
        proxy_set_header Forwarded "";

        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
